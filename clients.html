<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clients — Gestion Pièces Auto</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="brand">🔧 Pièces Auto <span class="brand-tag">MVP</span></div>
    <a class="nav-link" href="index.html">📊 Tableau de bord</a>
    <a class="nav-link" href="catalogue.html">📦 Catalogue</a>
    <a class="nav-link" href="stock.html">↕️ Mouvements stock</a>
    <a class="nav-link active" href="clients.html">👤 Clients</a>
    <a class="nav-link" href="factures.html">🧾 Factures</a>
    <div class="sidebar-footer">
      <div class="hint mono" id="current-user-email" style="margin-bottom:8px;"></div>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div><h1>Clients</h1><div class="subtitle">Particuliers et professionnels</div></div>
      <button class="btn" onclick="openModal()">+ Nouveau client</button>
    </div>

    <div class="card">
      <div class="toolbar" style="margin-bottom:16px;">
        <input class="search-input" id="search" placeholder="Rechercher un client...">
      </div>
      <div id="table-content">Chargement...</div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title">Nouveau client</h3><button class="close-x" onclick="closeModal()">×</button></div>
    <form id="client-form">
      <input type="hidden" id="client-id">
      <label>Nom / Raison sociale *</label>
      <input id="nom" required>
      <div class="field-row">
        <div><label>Téléphone</label><input id="telephone"></div>
        <div><label>Email</label><input id="email" type="email"></div>
      </div>
      <label>Adresse</label>
      <textarea id="adresse"></textarea>
      <div id="form-msg"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn" id="save-btn">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
let allClients = [];

async function loadClients() {
  const { data, error } = await supabaseClient.from("clients").select("*").order("nom");
  const el = document.getElementById("table-content");
  if (error) { el.innerHTML = `<div class="error-msg">${esc(friendlyError(error))}</div>`; return; }
  allClients = data || [];
  renderTable(allClients);
}

function renderTable(clients) {
  const el = document.getElementById("table-content");
  if (clients.length === 0) { el.innerHTML = `<div class="empty-state">Aucun client. Clique sur "+ Nouveau client" pour commencer.</div>`; return; }
  el.innerHTML = `
    <table>
      <thead><tr><th>Nom</th><th>Téléphone</th><th>Email</th><th>Ajouté le</th><th></th></tr></thead>
      <tbody>
        ${clients.map(c => `
          <tr>
            <td>${esc(c.nom)}</td>
            <td>${esc(c.telephone || "—")}</td>
            <td>${esc(c.email || "—")}</td>
            <td class="hint">${fmtDate(c.created_at)}</td>
            <td class="actions-cell">
              <button class="btn-icon" title="Modifier" onclick="editClient(${c.id})">✏️</button>
              <button class="btn-icon" title="Supprimer" onclick="deleteClient(${c.id})">🗑️</button>
            </td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { renderTable(allClients); return; }
  renderTable(allClients.filter(c => (c.nom || "").toLowerCase().includes(q) || (c.telephone || "").includes(q)));
});

function openModal() {
  document.getElementById("client-form").reset();
  document.getElementById("client-id").value = "";
  document.getElementById("modal-title").textContent = "Nouveau client";
  clearMsg(document.getElementById("form-msg"));
  document.getElementById("modal-backdrop").classList.add("open");
}

function editClient(id) {
  const c = allClients.find(x => x.id === id);
  if (!c) return;
  document.getElementById("client-id").value = c.id;
  document.getElementById("nom").value = c.nom;
  document.getElementById("telephone").value = c.telephone || "";
  document.getElementById("email").value = c.email || "";
  document.getElementById("adresse").value = c.adresse || "";
  document.getElementById("modal-title").textContent = "Modifier le client";
  clearMsg(document.getElementById("form-msg"));
  document.getElementById("modal-backdrop").classList.add("open");
}

function closeModal() { document.getElementById("modal-backdrop").classList.remove("open"); }

async function deleteClient(id) {
  const c = allClients.find(x => x.id === id);
  if (!confirm(`Supprimer le client "${c.nom}" ?`)) return;
  const { error } = await supabaseClient.from("clients").delete().eq("id", id);
  if (error) { alert(friendlyError(error)); return; }
  loadClients();
}

document.getElementById("client-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById("form-msg");
  clearMsg(msgEl);
  const btn = document.getElementById("save-btn");
  btn.disabled = true; btn.textContent = "Enregistrement...";

  const id = document.getElementById("client-id").value;
  const payload = {
    nom: document.getElementById("nom").value.trim(),
    telephone: document.getElementById("telephone").value.trim() || null,
    email: document.getElementById("email").value.trim() || null,
    adresse: document.getElementById("adresse").value.trim() || null,
  };

  let error;
  if (id) ({ error } = await supabaseClient.from("clients").update(payload).eq("id", id));
  else ({ error } = await supabaseClient.from("clients").insert(payload));

  btn.disabled = false; btn.textContent = "Enregistrer";
  if (error) { showMsg(msgEl, friendlyError(error)); return; }
  closeModal();
  loadClients();
});

(async () => {
  const session = await requireAuth();
  if (!session) return;
  loadClients();
})();
</script>
</body>
</html>
