<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouvements stock — Sylla Automobile — Ziguinchor</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="brand"><img src="assets/img/logo-sylla-icon.png" class="brand-logo" alt="Sylla Automobile"> Sylla Automobile <span class="brand-tag">Ziguinchor</span></div>
    <a class="nav-link" href="index.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg> Tableau de bord</a>
    <a class="nav-link" href="catalogue.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg> Catalogue</a>
    <a class="nav-link active" href="stock.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v18"/><path d="M4 7l4-4 4 4"/><path d="M16 21V3"/><path d="M20 17l-4 4-4-4"/></svg> Mouvements stock</a>
    <a class="nav-link" href="rupture-stock.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 17h.01"/></svg> Ruptures de stock</a>
    <a class="nav-link" href="factures.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v19l-3-2-3 2-3-2-3 2V2z"/><path d="M9 8h6M9 12h6"/></svg> Factures</a>
    <a class="nav-link" href="credits.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> Emprunts</a>
    <div class="sidebar-footer">
      <div class="hint mono" id="current-user-email" style="margin-bottom:8px;"></div>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Mouvements de stock</h1>
        <div class="subtitle">Entrées, sorties manuelles et ajustements d'inventaire</div>
      </div>
    </div>

    <div class="card">
      <h3>Nouveau mouvement</h3>
      <form id="mvt-form">
        <div class="field-row">
          <div>
            <label>Pièce *</label>
            <select id="piece_id" required><option value="">Sélectionner...</option></select>
          </div>
          <div>
            <label>Type de mouvement *</label>
            <select id="type_mouvement" required>
              <option value="ENTREE">Entrée (réception fournisseur)</option>
              <option value="SORTIE">Sortie manuelle (casse, prêt...)</option>
              <option value="AJUSTEMENT">Ajustement (inventaire physique)</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div>
            <label id="qty-label">Quantité *</label>
            <input id="quantite" type="number" min="1" step="1" required>
          </div>
          <div>
            <label>Motif</label>
            <input id="motif" placeholder="ex: Réception BL-4521">
          </div>
        </div>
        <p class="hint" id="stock-actuel-hint"></p>
        <div id="form-msg"></div>
        <button type="submit" class="btn" style="margin-top:14px;" id="submit-btn">Enregistrer le mouvement</button>
      </form>
    </div>

    <div class="card">
      <div class="card-head"><h3>Historique récent</h3></div>
      <div id="historique-content">Chargement...</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
let piecesMap = {};

async function loadPiecesSelect() {
  const { data, error } = await fetchAllRows(() =>
    supabaseClient.from("pieces").select("id, designation, reference_interne, quantite_stock").eq("actif", true).order("designation").order("id")
  );
  if (error) return;
  const sel = document.getElementById("piece_id");
  data.forEach(p => {
    piecesMap[p.id] = p;
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = `${p.designation} (${p.reference_interne}) — stock: ${p.quantite_stock}`;
    sel.appendChild(opt);
  });
}

function updateHint() {
  const pieceId = document.getElementById("piece_id").value;
  const type = document.getElementById("type_mouvement").value;
  const qtyLabel = document.getElementById("qty-label");
  const hint = document.getElementById("stock-actuel-hint");

  qtyLabel.textContent = type === "AJUSTEMENT" ? "Nouvelle quantité réelle (comptée) *" : "Quantité *";

  if (pieceId && piecesMap[pieceId]) {
    hint.textContent = `Stock actuel enregistré : ${piecesMap[pieceId].quantite_stock}`;
  } else {
    hint.textContent = "";
  }
}
document.getElementById("piece_id").addEventListener("change", updateHint);
document.getElementById("type_mouvement").addEventListener("change", updateHint);

async function loadHistorique() {
  const el = document.getElementById("historique-content");
  const { data, error } = await supabaseClient
    .from("mouvements_stock")
    .select("id, type_mouvement, quantite, quantite_avant, quantite_apres, motif, created_at, pieces(designation, reference_interne)")
    .order("created_at", { ascending: false })
    .limit(40);

  if (error) { el.innerHTML = `<div class="error-msg">${esc(friendlyError(error))}</div>`; return; }
  if (!data || data.length === 0) { el.innerHTML = `<div class="empty-state">Aucun mouvement enregistré pour le moment.</div>`; return; }

  const badgeClass = { ENTREE: "badge-success", SORTIE: "badge-danger", AJUSTEMENT: "badge-warn" };
  const label = { ENTREE: "Entrée", SORTIE: "Sortie", AJUSTEMENT: "Ajustement" };

  el.innerHTML = `
    <table>
      <thead><tr><th>Date</th><th>Pièce</th><th>Type</th><th class="num">Avant</th><th class="num">Après</th><th>Motif</th></tr></thead>
      <tbody>
        ${data.map(m => `
          <tr>
            <td class="hint">${fmtDateTime(m.created_at)}</td>
            <td>${esc(m.pieces?.designation || "—")}</td>
            <td><span class="badge ${badgeClass[m.type_mouvement]}">${label[m.type_mouvement]}</span></td>
            <td class="num">${m.quantite_avant}</td>
            <td class="num">${m.quantite_apres}</td>
            <td class="hint">${esc(m.motif || "—")}</td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

document.getElementById("mvt-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById("form-msg");
  clearMsg(msgEl);
  const btn = document.getElementById("submit-btn");
  btn.disabled = true; btn.textContent = "Enregistrement...";

  const { error } = await supabaseClient.rpc("enregistrer_mouvement_stock", {
    p_piece_id: Number(document.getElementById("piece_id").value),
    p_type: document.getElementById("type_mouvement").value,
    p_quantite: Number(document.getElementById("quantite").value),
    p_motif: document.getElementById("motif").value.trim() || null,
  });

  btn.disabled = false; btn.textContent = "Enregistrer le mouvement";

  if (error) { showMsg(msgEl, friendlyError(error)); return; }

  showMsg(msgEl, "Mouvement enregistré.", "success");
  document.getElementById("mvt-form").reset();
  piecesMap = {};
  document.getElementById("piece_id").innerHTML = '<option value="">Sélectionner...</option>';
  await loadPiecesSelect();
  loadHistorique();
});

(async () => {
  const session = await requireAuth();
  if (!session) return;
  await loadPiecesSelect();
  loadHistorique();
})();
</script>
</body>
</html>
