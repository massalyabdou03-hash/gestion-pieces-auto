<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouvements stock — Sylla Automobile — Ziguinchor</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="brand"><img src="assets/img/logo-sylla-icon.png" class="brand-logo" alt="Sylla Automobile"> Sylla Automobile <span class="brand-tag">Ziguinchor</span></div>
    <a class="nav-link" href="index.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg> Tableau de bord</a>
    <a class="nav-link" href="catalogue.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg> Catalogue</a>
    <a class="nav-link active" href="stock.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v18"/><path d="M4 7l4-4 4 4"/><path d="M16 21V3"/><path d="M20 17l-4 4-4-4"/></svg> Mouvements stock</a>
    <a class="nav-link" href="rupture-stock.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 17h.01"/></svg> Ruptures de stock</a>
    <a class="nav-link" href="factures.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v19l-3-2-3 2-3-2-3 2V2z"/><path d="M9 8h6M9 12h6"/></svg> Factures</a>
    <a class="nav-link" href="credits.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> Emprunts</a>
    <a class="nav-link" href="clients.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Clients</a>
    <div class="sidebar-footer">
      <div class="hint mono" id="current-user-email" style="margin-bottom:8px;"></div>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Mouvements de stock</h1>
        <div class="subtitle">Entrées, sorties manuelles et ajustements d'inventaire</div>
      </div>
    </div>

    <div class="card">
      <h3>Nouveau mouvement</h3>
      <form id="mvt-form">
        <div class="field-row">
          <div>
            <label>Pièce *</label>
            <div class="piece-search" id="piece-search">
              <input type="text" class="piece-search-input" id="piece-search-input" placeholder="Rechercher une pièce (référence, désignation, marque)..." autocomplete="off">
              <div class="piece-search-results"></div>
            </div>
          </div>
          <div>
            <label>Type de mouvement *</label>
            <select id="type_mouvement" required>
              <option value="ENTREE">Entrée (réception fournisseur)</option>
              <option value="SORTIE">Sortie manuelle (casse, prêt...)</option>
              <option value="AJUSTEMENT">Ajustement (inventaire physique)</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div>
            <label id="qty-label">Quantité *</label>
            <input id="quantite" type="number" min="1" step="1" required>
          </div>
          <div>
            <label>Motif</label>
            <input id="motif" placeholder="ex: Réception BL-4521">
          </div>
        </div>
        <p class="hint" id="stock-actuel-hint"></p>
        <div id="form-msg"></div>
        <button type="submit" class="btn" style="margin-top:14px;" id="submit-btn">Enregistrer le mouvement</button>
      </form>
    </div>

    <div class="card">
      <div class="card-head"><h3>Historique récent</h3></div>
      <div id="historique-content">Chargement...</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
let piecesMap = {};
let latestMouvements = [];
const pieceWidget = initPieceSearch(document.getElementById("piece-search"), [], {
  getStockLabel: (p) => computeEffectiveStock(p.id, p.quantite_stock),
  onSelect: updateHint,
});

async function loadPiecesSelect() {
  const { items, offline, savedAt } = await loadWithCache("pieces", () =>
    fetchAllRows(() => supabaseClient.from("pieces").select("*").eq("actif", true).order("designation").order("id"))
  );
  if (offline && savedAt) showToast(`Catalogue hors ligne : données du ${fmtDateTime(savedAt)}.`, "info");
  piecesMap = {};
  items.forEach(p => { piecesMap[p.id] = p; });
  pieceWidget.setPieces(items);
}

function updateHint() {
  const piece = pieceWidget.getSelected();
  const type = document.getElementById("type_mouvement").value;
  const qtyLabel = document.getElementById("qty-label");
  const hint = document.getElementById("stock-actuel-hint");

  qtyLabel.textContent = type === "AJUSTEMENT" ? "Nouvelle quantité réelle (comptée) *" : "Quantité *";

  if (piece) {
    const effectif = computeEffectiveStock(piece.id, piece.quantite_stock);
    hint.textContent = appIsOnline
      ? `Stock actuel enregistré : ${piece.quantite_stock}`
      : `Stock estimé (avec mouvements en attente) : ${effectif}`;
  } else {
    hint.textContent = "";
  }
}
document.getElementById("type_mouvement").addEventListener("change", updateHint);

function renderPendingMovementRow(m) {
  const badgeClass = { ENTREE: "badge-success", SORTIE: "badge-danger", AJUSTEMENT: "badge-warn" };
  const label = { ENTREE: "Entrée", SORTIE: "Sortie", AJUSTEMENT: "Ajustement" };
  const statusBadge = {
    pending: '<span class="badge badge-info">En attente</span>',
    syncing: '<span class="badge badge-info">Synchronisation...</span>',
    error: '<span class="badge badge-danger">Erreur</span>',
  };
  return `
    <tr>
      <td class="hint">${fmtDateTime(m.createdAt)}</td>
      <td>${esc(m.piece_designation || "—")}</td>
      <td><span class="badge ${badgeClass[m.type_mouvement]}">${label[m.type_mouvement]}</span></td>
      <td class="num hint">—</td>
      <td class="num hint">—</td>
      <td class="hint">
        ${esc(m.motif || "—")}
        ${statusBadge[m.status] || ""}
        ${m.status === "error" ? `<div style="color:var(--danger);">${esc(m.errorMsg || "")}</div>` : ""}
      </td>
      <td></td>
    </tr>`;
}

async function loadHistorique() {
  const el = document.getElementById("historique-content");
  const { items, offline, savedAt } = await loadWithCache("mouvements", () =>
    supabaseClient
      .from("mouvements_stock")
      .select("id, type_mouvement, quantite, quantite_avant, quantite_apres, motif, facture_id, created_at, pieces(designation, reference_interne)")
      .order("created_at", { ascending: false })
      .limit(40)
  );
  latestMouvements = items;

  const pending = getPendingMovements()
    .filter(m => m.status !== "done")
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  if (offline && savedAt) showToast(`Historique hors ligne : données du ${fmtDateTime(savedAt)}.`, "info");

  if (items.length === 0 && pending.length === 0) {
    el.innerHTML = `<div class="empty-state">Aucun mouvement enregistré pour le moment.</div>`;
    return;
  }

  const badgeClass = { ENTREE: "badge-success", SORTIE: "badge-danger", AJUSTEMENT: "badge-warn" };
  const label = { ENTREE: "Entrée", SORTIE: "Sortie", AJUSTEMENT: "Ajustement" };

  el.innerHTML = `
    <table>
      <thead><tr><th>Date</th><th>Pièce</th><th>Type</th><th class="num">Avant</th><th class="num">Après</th><th>Motif</th><th></th></tr></thead>
      <tbody>
        ${pending.map(renderPendingMovementRow).join("")}
        ${items.map(m => `
          <tr>
            <td class="hint">${fmtDateTime(m.created_at)}</td>
            <td>${esc(m.pieces?.designation || "—")}</td>
            <td><span class="badge ${badgeClass[m.type_mouvement]}">${label[m.type_mouvement]}</span></td>
            <td class="num">${m.quantite_avant}</td>
            <td class="num">${m.quantite_apres}</td>
            <td class="hint">${esc(m.motif || "—")}</td>
            <td class="actions-cell">
              ${m.facture_id
                ? `<span class="hint" title="Généré par une facture : annule la facture plutôt que ce mouvement.">—</span>`
                : `<button class="btn-icon" title="Supprimer ce mouvement" onclick="supprimerMouvement(${m.id})"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>`}
            </td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

async function supprimerMouvement(id) {
  if (!appIsOnline) { showToast("Connexion requise pour supprimer un mouvement.", "error"); return; }
  const mvt = latestMouvements.find(m => m.id === id);
  const ok = await confirmDialog(
    `Supprimer ce mouvement${mvt ? ` (${mvt.pieces?.designation || "pièce"})` : ""} ? Le stock de la pièce sera corrigé automatiquement en conséquence.`,
    { title: "Supprimer le mouvement", confirmLabel: "Supprimer", danger: true }
  );
  if (!ok) return;

  const { error } = await supabaseClient.rpc("supprimer_mouvement_stock", { p_mouvement_id: id });
  if (error) { showToast(friendlyError(error), "error"); return; }
  showToast("Mouvement supprimé — stock corrigé.", "success");
  await loadPiecesSelect();
  loadHistorique();
}

document.getElementById("mvt-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById("form-msg");
  clearMsg(msgEl);
  const btn = document.getElementById("submit-btn");

  const piece = pieceWidget.getSelected();
  if (!piece) { showMsg(msgEl, "Sélectionne une pièce."); return; }

  btn.disabled = true; btn.textContent = "Enregistrement...";

  const payload = {
    piece_id: piece.id,
    piece_designation: piece.designation,
    type_mouvement: document.getElementById("type_mouvement").value,
    quantite: Number(document.getElementById("quantite").value),
    motif: document.getElementById("motif").value.trim() || null,
  };

  if (!appIsOnline) {
    queuePendingMovement(payload);
    btn.disabled = false; btn.textContent = "Enregistrer le mouvement";
    showToast("Mouvement enregistré hors ligne — il sera synchronisé automatiquement au retour de la connexion.", "info");
    document.getElementById("mvt-form").reset();
    pieceWidget.clear();
    updateHint();
    loadHistorique();
    return;
  }

  const { error } = await supabaseClient.rpc("enregistrer_mouvement_stock", {
    p_piece_id: payload.piece_id,
    p_type: payload.type_mouvement,
    p_quantite: payload.quantite,
    p_motif: payload.motif,
  });

  btn.disabled = false; btn.textContent = "Enregistrer le mouvement";

  if (error) { showMsg(msgEl, friendlyError(error)); return; }

  showMsg(msgEl, "Mouvement enregistré.", "success");
  document.getElementById("mvt-form").reset();
  pieceWidget.clear();
  await loadPiecesSelect();
  loadHistorique();
});

(async () => {
  const session = await requireAuth();
  if (!session) return;
  await loadPiecesSelect();
  loadHistorique();
  document.addEventListener("sylla:pending-movements-updated", loadHistorique);
})();
</script>
</body>
</html>
