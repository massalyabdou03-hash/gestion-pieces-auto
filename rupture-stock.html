<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruptures de stock — Sylla Automobile — Ziguinchor</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="brand"><img src="assets/img/logo-sylla-icon.png" class="brand-logo" alt="Sylla Automobile"> Sylla Automobile <span class="brand-tag">Ziguinchor</span></div>
    <a class="nav-link" href="index.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg> Tableau de bord</a>
    <a class="nav-link" href="catalogue.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg> Catalogue</a>
    <a class="nav-link" href="stock.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v18"/><path d="M4 7l4-4 4 4"/><path d="M16 21V3"/><path d="M20 17l-4 4-4-4"/></svg> Mouvements stock</a>
    <a class="nav-link active" href="rupture-stock.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 17h.01"/></svg> Ruptures de stock</a>
    <a class="nav-link" href="factures.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v19l-3-2-3 2-3-2-3 2V2z"/><path d="M9 8h6M9 12h6"/></svg> Factures</a>
    <a class="nav-link" href="credits.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> Emprunts</a>
    <div class="sidebar-footer">
      <div class="hint mono" id="current-user-email" style="margin-bottom:8px;"></div>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Ruptures de stock</h1>
        <div class="subtitle">Pièces totalement épuisées — à inclure dans la prochaine commande</div>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="export-btn" onclick="exportExcel()">Exporter en Excel</button>
      </div>
    </div>

    <div class="card">
      <div class="toolbar" style="margin-bottom:16px;">
        <input class="search-input" id="search" placeholder="Rechercher (référence, désignation, marque, emplacement)...">
      </div>
      <div id="table-content">Chargement...</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
let rupturePieces = [];

async function loadRuptures() {
  const el = document.getElementById("table-content");
  const { data, error } = await fetchAllRows(() =>
    supabaseClient.from("pieces").select("*").eq("actif", true).eq("quantite_stock", 0).order("designation").order("id")
  );
  if (error) { el.innerHTML = `<div class="error-msg">${esc(friendlyError(error))}</div>`; return; }
  rupturePieces = data || [];
  renderTable(rupturePieces);
}

function renderTable(pieces) {
  const el = document.getElementById("table-content");
  document.getElementById("export-btn").disabled = rupturePieces.length === 0;

  if (rupturePieces.length === 0) {
    el.innerHTML = `<div class="empty-state">Aucune pièce en rupture — tout le stock a au moins une unité disponible.</div>`;
    return;
  }
  if (pieces.length === 0) {
    el.innerHTML = `<div class="empty-state">Aucun résultat pour cette recherche.</div>`;
    return;
  }

  el.innerHTML = `
    <p class="hint" style="margin-top:0;">${pieces.length} pièce(s) en rupture de stock.</p>
    <table>
      <thead><tr>
        <th>Référence</th><th>Désignation</th><th>Marque</th><th>Catégorie</th><th>Emplacement</th>
        <th class="num">Prix achat</th><th class="num">Seuil d'alerte</th>
      </tr></thead>
      <tbody>
        ${pieces.map(p => `
          <tr>
            <td><div class="ref">${esc(p.reference_oem)}</div><div class="hint">${esc(p.reference_interne)}</div></td>
            <td>${esc(p.designation)}</td>
            <td>${esc(p.marque || "—")}</td>
            <td>${esc(p.categorie || "—")}</td>
            <td>${esc(p.emplacement || "—")}</td>
            <td class="num">${fmtMoney(p.prix_achat)}</td>
            <td class="num">${p.seuil_alerte}</td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { renderTable(rupturePieces); return; }
  renderTable(rupturePieces.filter(p =>
    (p.reference_oem || "").toLowerCase().includes(q) ||
    (p.reference_interne || "").toLowerCase().includes(q) ||
    (p.designation || "").toLowerCase().includes(q) ||
    (p.marque || "").toLowerCase().includes(q) ||
    (p.emplacement || "").toLowerCase().includes(q)
  ));
});

function exportExcel() {
  if (rupturePieces.length === 0) return;

  const rows = rupturePieces.map(p => ({
    "Référence OEM": p.reference_oem,
    "Référence interne": p.reference_interne,
    "Désignation": p.designation,
    "Marque": p.marque || "",
    "Catégorie": p.categorie || "",
    "Emplacement": p.emplacement || "",
    "Prix d'achat": Number(p.prix_achat || 0),
    "Prix de vente": Number(p.prix_vente || 0),
    "Seuil d'alerte": p.seuil_alerte,
    "Quantité à commander": p.seuil_alerte > 0 ? p.seuil_alerte : 1,
  }));

  const sheet = XLSX.utils.json_to_sheet(rows);
  sheet["!cols"] = [
    { wch: 18 }, { wch: 18 }, { wch: 32 }, { wch: 16 }, { wch: 16 },
    { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 18 },
  ];

  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, sheet, "Ruptures de stock");

  const today = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(workbook, `ruptures_stock_${today}.xlsx`);
}

(async () => {
  const session = await requireAuth();
  if (!session) return;
  await loadRuptures();
})();
</script>
</body>
</html>
